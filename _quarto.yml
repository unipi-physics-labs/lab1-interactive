project:
  type: book
  output-dir: _book
  resources:
    - interattivi/**
    - immagini/**

lang: it

book:
  title: "Lab1: laboratorio interattivo"
  subtitle: "Probabilità e statistica"
  author: "Giulia Casarosa"
  output-file: lab1_interattivo
  chapters:
    - index.qmd
    - capitoli/binomiale.qmd
  sidebar:
    style: docked
    search: true
  page-footer:
    left: "Lab1 · Concetti, esempi, laboratorio"
    right: "CC BY-SA 4.0"

format:
  html:
    theme: cosmo
    css: assets/stile.css
    html-math-method: mathml
    toc: true
    toc-depth: 2
    number-sections: true
    code-copy: true
    include-after-body: assets/frame-resize.html
  typst:
    papersize: a4
    fontsize: 11pt
    include-in-header: assets/pdf.typ
    template-partials:
      - assets/typst-show.typ
    toc: true
    toc-depth: 2
    number-sections: true

execute:
  enabled: false
