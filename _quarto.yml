project:
  type: book
  output-dir: _book
  resources:
    - interattivi/**
    - immagini/**

lang: it

book:
  title: "Lab1: laboratorio interattivo"
  subtitle: "Probabilità e statistica"
  author: "Giulia Casarosa"
  chapters:
    - index.qmd
    - capitoli/distribuzioni-stimatori.qmd
    - capitoli/binomiale.qmd
    - capitoli/poisson.qmd
    - capitoli/esponenziale.qmd
  sidebar:
    style: docked
    search: true
  page-footer:
    left: "Lab1 · Concetti, esempi, laboratorio"
    right: "CC BY-SA 4.0"

format:
  html:
    theme: cosmo
    css: assets/stile.css
    html-math-method: mathml
    toc: true
    toc-depth: 2
    number-sections: true
    code-copy: true
    include-after-body: assets/frame-resize.html

execute:
  enabled: false
