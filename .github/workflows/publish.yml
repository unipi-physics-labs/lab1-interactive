# Salva questo file come .github/workflows/publish.yml nel repository.
# Push su main: artifacts di controllo.
# Push di un tag: release con ZIP HTML.
# Il sito viene pubblicato localmente con make publish sul branch pages.
# Per Pages: Settings > Pages > Deploy from a branch > pages > /(root).
name: Genera laboratorio e release

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laboratorio-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v6

      - name: Installa Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"

      - name: Individua la cartella del progetto
        id: project
        shell: bash
        run: |
          if [ -f _quarto.yml ]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          elif [ -f lab1_quarto/_quarto.yml ]; then
            echo "directory=lab1_quarto" >> "$GITHUB_OUTPUT"
          else
            echo "::error::File _quarto.yml non trovato nella radice o nella cartella lab1_quarto."
            exit 1
          fi

      - name: Genera il laboratorio HTML
        working-directory: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          quarto render --to html
          test -s _book/index.html

      - name: Salva il laboratorio come archivio scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: lab1-html
          path: ${{ steps.project.outputs.directory }}/_book/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Allega i file alla release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Recupera il laboratorio HTML
        uses: actions/download-artifact@v4
        with:
          name: lab1-html
          path: _book

      - name: Prepara lo ZIP della versione HTML
        working-directory: _book
        run: zip -r ../lab1_html.zip .

      - name: Crea la release e carica i file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              lab1_html.zip \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              lab1_html.zip \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "Laboratorio interattivo Lab1: versione HTML da scaricare ed estrarre." \
              --latest
          fi

