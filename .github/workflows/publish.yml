# Salva questo file come .github/workflows/publish.yml nel repository.
# Se esiste il precedente workflow per GitHub Pages, sostituiscilo.
name: Genera HTML e PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dispensa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v6

      - name: Installa Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"

      - name: Individua la cartella del progetto
        id: project
        shell: bash
        run: |
          if [ -f _quarto.yml ]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          elif [ -f lab1_quarto/_quarto.yml ]; then
            echo "directory=lab1_quarto" >> "$GITHUB_OUTPUT"
          else
            echo "::error::File _quarto.yml non trovato nella radice o nella cartella lab1_quarto."
            exit 1
          fi

      - name: Genera HTML e PDF con Typst
        working-directory: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          quarto render --to html
          quarto render --to typst --no-clean
          test -s _book/index.html
          test -s _book/lab1_dispensa.pdf

      - name: Salva HTML e PDF come archivio scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: lab1-html-pdf
          path: ${{ steps.project.outputs.directory }}/_book/
          if-no-files-found: error
          retention-days: 30
