# Salva questo file come .github/workflows/publish.yml nel repository.
# Push su main: artifacts di controllo.
# Push di un tag: release con PDF/ZIP e pubblicazione HTML su GitHub Pages.
# I job release e pages sono indipendenti: un errore di Pages non blocca la release.
# Per Pages: Settings > Pages > Source: GitHub Actions.
# Se l'ambiente github-pages limita i deployment, autorizza anche i tag.
name: Genera laboratorio, release e sito

on:
  push:
    branches: [main]
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: laboratorio-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pdf_file: ${{ steps.config.outputs.pdf_file }}

    steps:
      - name: Scarica i sorgenti
        uses: actions/checkout@v6

      - name: Installa Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.11.9"

      - name: Individua la cartella del progetto
        id: project
        shell: bash
        run: |
          if [ -f _quarto.yml ]; then
            echo "directory=." >> "$GITHUB_OUTPUT"
          elif [ -f lab1_quarto/_quarto.yml ]; then
            echo "directory=lab1_quarto" >> "$GITHUB_OUTPUT"
          else
            echo "::error::File _quarto.yml non trovato nella radice o nella cartella lab1_quarto."
            exit 1
          fi

      - name: Leggi il nome del PDF dalla configurazione Quarto
        id: config
        working-directory: ${{ steps.project.outputs.directory }}
        shell: bash
        run: |
          quarto inspect > "$RUNNER_TEMP/quarto-inspect.json"
          python3 - "$RUNNER_TEMP/quarto-inspect.json" <<'PY'
          import json
          import os
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              config = json.load(stream)["config"]
          name = config.get("book", {}).get("output-file")
          if not isinstance(name, str) or not name.strip() or any(char in name for char in "\r\n/\\"):
              raise SystemExit("Imposta book.output-file in _quarto.yml con il nome del file, senza cartelle.")
          pdf_file = name if name.endswith(".pdf") else name + ".pdf"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as stream:
              stream.write(f"pdf_file={pdf_file}\n")
          print(f"PDF atteso: {pdf_file}")
          PY

      - name: Genera HTML e PDF con Typst
        working-directory: ${{ steps.project.outputs.directory }}
        env:
          PDF_FILE: ${{ steps.config.outputs.pdf_file }}
        shell: bash
        run: |
          quarto render --to html
          quarto render --to typst --no-clean
          test -s _book/index.html
          test -s "_book/$PDF_FILE"

      - name: Salva HTML e PDF come archivio scaricabile
        uses: actions/upload-artifact@v4
        with:
          name: lab1-html-pdf
          path: ${{ steps.project.outputs.directory }}/_book/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Allega i file alla release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PDF_FILE: ${{ needs.build.outputs.pdf_file }}

    steps:
      - name: Recupera HTML e PDF generati
        uses: actions/download-artifact@v4
        with:
          name: lab1-html-pdf
          path: _book

      - name: Prepara lo ZIP della versione HTML
        working-directory: _book
        run: zip -r ../lab1_html.zip . -x "$PDF_FILE"

      - name: Crea la release e carica i file
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "_book/$PDF_FILE" \
              lab1_html.zip \
              --clobber
          else
            gh release create "$RELEASE_TAG" \
              "_book/$PDF_FILE" \
              lab1_html.zip \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes "Laboratorio interattivo Lab1: PDF e versione HTML da scaricare ed estrarre." \
              --latest
          fi

  pages:
    name: Pubblica HTML su GitHub Pages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false

    steps:
      - name: Recupera HTML e PDF generati
        uses: actions/download-artifact@v4
        with:
          name: lab1-html-pdf
          path: _book

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepara il sito per GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _book

      - name: Pubblica il sito
        id: deployment
        uses: actions/deploy-pages@v4
